<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MOKEPON!</title>
        <script src="./js/mokepon2.0.js"></script> <!--Un punto le dice al PC que se pare en la carpeta actual y busque los archivos o capetas dispobibles. Dos puntos le dicen a VSCode "Sal de la carpeta actual y busca en la carpeta que está justo arriba (la carpeta padre)".-->
    </head>
    <body>
        <h1>MOKEPON! 🔥💧🌱</h1>

        <section id="seleccionar-mascota">
            <h2>Elige a tu mascota</h2>

            <label for="hipodoge">Hipodoge</label>
            <input type="radio" name="mascota" id="hipodoge">

            <label for="capipepo">Capipepo</label>
            <input type="radio" name="mascota" id="capipepo">

            <label for="Ratigueya">Ratigueya</label>
            <input type="radio" name="mascota" id="Ratigueya">

            <div>
                <button id="boton-mascota">Seleccionar</button>
            </div>
        </section>

        <section id="seleccionar-ataque">
            <h2>Elige tu ataque</h2>

            <p>Tu mascota <span id="mascota-jugador"></span> tiene <span>3</span> vidas</p>
            <p>La mascota <span id="mascota-enemigo"></span>rival tiene <span>3</span> vidas</p>

            <div>
                <button id="boton-fuego">Fuego🔥</button>
                <button id="boton-agua">Agua💧</button>
                <button id="boton-tierra">Tierra🌱</button>
            </div>
        </section>

        <section id="mensajes">
            <p></p>
        </section>

        <section>
            <div>
                <button id="reiniciar">Volver a jugar  </button>
            </div>
        </section>
    </body>
</html>
